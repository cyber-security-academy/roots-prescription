name: Build and deploy Roots Apotek app to the dev environment

# Only runs in roots-prescription: the group repos have no develop branch
on:
  push:
    branches:
      - 'develop'
  workflow_dispatch:  # To enable manual run of workflow

permissions:
  contents: read
  id-token: write

env:
  AZURE_WEBAPP_NAME: 'csa-gr${{ vars.GROUP_NUM }}-app'
  CONTAINER_REGISTRY: ${{ vars.REGISTRY_URL }}
  IMAGE_AND_TAG: '${{ vars.REGISTRY_URL }}/csa-roots-${{ vars.GROUP_NUM }}:${{ github.sha }}'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Azure trusts repo:cyber-security-academy/roots-prescription:environment:dev,
    # and the environment only allows the develop branch
    environment: dev
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Azure authentication
      uses: azure/login@v2
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    - name: ACR authentication
      shell: bash
      run: |
        TOKEN=$(az acr login --name $CONTAINER_REGISTRY --expose-token --output tsv --query accessToken --only-show-errors)
        docker login $CONTAINER_REGISTRY --username 00000000-0000-0000-0000-000000000000 --password-stdin <<< "$TOKEN"

    - name: Docker Build & Push to ACR
      run: |
        docker build . -t $IMAGE_AND_TAG
        docker push $IMAGE_AND_TAG
        echo "### 🚀 Pushed image to ACR" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "$IMAGE_AND_TAG" >> $GITHUB_STEP_SUMMARY

    - name: Set Splunk token for HTTP Event Collector
      uses: Azure/appservice-settings@v1
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        app-settings-json: |
          [
              {
                  "name": "Serilog__WriteTo__1__Args__configureLogger__WriteTo__0__Args__splunkHost",
                  "value": "${{ vars.SPLUNK_URL }}",
                  "slotSetting": false
              },
              {
                  "name": "Serilog__WriteTo__1__Args__configureLogger__WriteTo__0__Args__eventCollectorToken",
                  "value": "${{ secrets.SPLUNK_TOKEN }}",
                  "slotSetting": false
              },
              {
                  "name": "GroupName",
                  "value": "Dev",
                  "slotSetting": false
              }
          ]

    - name: Deploy to Azure Web App for Container
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        images: ${{ env.IMAGE_AND_TAG }}
